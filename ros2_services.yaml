      # ── RMUL 2025 正赛 (脚本 + launch 文件方式) ──────────────────
      # Nav2 导航 + 正赛控制器一体化启动:
      #   run_competition.sh → competition_launch.py
      #     → Nav2 (slam=True, 在线建图)
      #     → competition_controller.py (裁判监听/导航/自瞄/热量/撤退)
      #
      # 手动指定地图: 修改 launch_command 末尾的路径参数
      #   bash .../run_competition.sh reserve/field_training_latest
      #
      - unit_name: ros2-competition.service
        description: RMUL 2025 Competition (Nav2 + Controller)
        depends_on:
          - ros2-universal-controller.service
          - ros2-dji-referee-protocol.service
          - ros2-sp-vision-autoaim.service
        service_options:
          - CPUAffinity=4 5 6 7 8 9 10 11
        launch_command: bash /home/soyo/sentry_ws/scripts/run_competition.sh
